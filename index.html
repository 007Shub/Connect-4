<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Connect 4</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
  body { background:#1e1e1e; color:#eee; margin:0; padding:16px; font-family:system-ui,sans-serif; }
  h1 { margin:0 0 12px; }
  #terminal { max-width:760px; }
  #again {
    display:none; margin-top:14px; padding:10px 20px; font-size:16px; cursor:pointer;
    background:#f5b301; color:#1e1e1e; border:none; border-radius:8px; font-weight:bold;
  }
  #again:hover { background:#ffc72c; }
</style>
</head>
<body>
  <h1>Connect 4 (C)</h1>
  <div id="terminal"></div>
  <button id="again" onclick="location.reload()">🔄 Play Again</button>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script>
    const term = new Terminal({ convertEol:true, cursorBlink:true, cols:60, rows:32,
                                theme:{ background:'#1e1e1e' } });
    term.open(document.getElementById('terminal'));
    term.focus();

    let lineBuf = '';
    let lineResolve = null;
    term.onData(function (data) {
      for (const ch of data) {
        const code = ch.charCodeAt(0);
        if (code === 13) {                        // Enter
          term.write('\r\n');
          const line = lineBuf; lineBuf = '';
          if (lineResolve) { const r = lineResolve; lineResolve = null; r(line); }
        } else if (code === 127) {                // Backspace
          if (lineBuf.length) { lineBuf = lineBuf.slice(0, -1); term.write('\b \b'); }
        } else if (code >= 32) {                  // printable
          lineBuf += ch; term.write(ch);
        }
      }
    });

    // Show the Play Again button once the game is over
    function checkGameOver(text) {
      if (/Won!|Nobody won/.test(text)) {
        document.getElementById('again').style.display = 'inline-block';
      }
    }

    var Module = 
      print:    function (text) { term.write(text + '\r\n'); checkGameOver(text); },
      printErr: function (text) { term.write(text + '\r\n'); },
      readLine: function () { return new Promise(function (res) { lineResolve = res; }); }
    };
  </script>
  <script src="connect4.js"></script>
</body>
</html>
